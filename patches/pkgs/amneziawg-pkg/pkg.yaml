# Overlaid onto a siderolabs/pkgs checkout (see Makefile's checkout-pkgs target) at
# amneziawg/pkg.yaml. bldr discovers pkg.yaml files by walking the repo tree - no
# .kres.yaml registration needed (confirmed against bldr's own source,
# internal/pkg/solver/filesystem_loader.go's filepath.Walk) - so dropping this file in is
# sufficient; `make docker-amneziawg-pkg` (the generic pattern rule every kres-generated
# pkgs Makefile carries) picks it up on its own.
#
# AWG_REF/AWG_SHA256/AWG_SHA512 come in as --build-arg (this checkout's own Pkgfile vars:
# block is upstream's, not ours to merge into) - see the BUILD_ARG_ prefix convention
# siderolabs/extensions itself uses for cross-repo values like PKGS/PKGS_PREFIX.
#
# Modeled directly on this same checkout's zfs/pkg.yaml and gasket-driver/pkg.yaml - the
# two real out-of-tree kernel modules siderolabs already ships this exact way. The
# `dependencies: [stage: kernel-build]` line is what matters: it pulls in the kernel
# source tree at /src, including certs/signing_key.pem - a key kbuild auto-generates (from
# certs/x509.genkey, since no persistent key file exists) the *first* time `make` runs
# against this tree, then reuses via BuildKit's ordinary layer cache for every stage built
# afterward from the same warm cache, including this one. That's the entire mechanism
# behind "kernel and module get the same signing key" - no PKI of our own, nothing to
# manage or rotate. See docs/kernel-signing.md for why this matters and what breaks it
# (building against a stale/pruned cache produces a module signed by a key the actual
# running kernel doesn't trust).
name: amneziawg-pkg
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - stage: kernel-build
  - image: "{{ .LLVM_IMAGE }}:{{ .TOOLS_REV }}"
steps:
  - sources:
      - url: https://github.com/amnezia-vpn/amneziawg-linux-kernel-module/archive/{{ .BUILD_ARG_AWG_REF }}.tar.gz
        destination: awg.tar.gz
        sha256: "{{ .BUILD_ARG_AWG_SHA256 }}"
        sha512: "{{ .BUILD_ARG_AWG_SHA512 }}"
    env:
      ARCH: {{ if eq .ARCH "aarch64"}}arm64{{ else if eq .ARCH "x86_64" }}x86_64{{ else }}unsupported{{ end }}
      LLVM: 1
    prepare:
      - |
        tar -xzf awg.tar.gz --strip-components=1
    build:
      - |
        make -j $(nproc) -C /src M="$(pwd)/src" modules
    install:
      - |
        make -j $(nproc) -C /src M="$(pwd)/src" modules_install DESTDIR=/rootfs \
          INSTALL_MOD_PATH=/rootfs/usr INSTALL_MOD_DIR=extras INSTALL_MOD_STRIP=1 \
          CONFIG_MODULE_SIG_ALL=y
    test:
      - |
        # https://www.kernel.org/doc/html/v4.15/admin-guide/module-signing.html#signed-modules-and-stripping
        find /rootfs/usr/lib/modules -name '*.ko' -exec grep -FL '~Module signature appended~' {} \+
finalize:
  - from: /rootfs
    to: /
