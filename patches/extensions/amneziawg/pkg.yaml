# Overlaid onto a siderolabs/extensions checkout (see Makefile's checkout-extensions
# target) at amneziawg/pkg.yaml, alongside awg-service.yaml (copied from the sibling
# ../talos-extensions repo's extension-services/awg.yaml at build time - the fixed
# container spec ext-awg ships with) and awg-bin (the cross-compiled ext-awg binary,
# staged in by `make daemons` before this runs). Modeled on this same checkout's
# storage/zfs/pkg.yaml: pulls in the kernel module from the amneziawg-pkg OCI image built
# in siderolabs/pkgs (see ../pkgs/amneziawg-pkg/pkg.yaml) via `dependencies: [image: ...]`,
# same as zfs pulls in zfs-pkg - it's a plain OCI layer merge, not a rebuild, so the
# module's signature (against the kernel built alongside it) is untouched.
#
# `name:` below must match manifest.yaml.tmpl's `metadata.name` (both `amneziawg`) - not
# cosmetic: extensions-validator's --pkg-name check (the `test:` step below) requires
# bldr's own PKG_NAME env var, derived from this field, to equal the manifest's
# metadata.name, or the build fails with "pkg name does not match extension name".
name: amneziawg
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - image: "{{ .BUILD_ARG_PKGS_PREFIX }}/amneziawg-pkg:{{ .BUILD_ARG_PKGS }}"
steps:
  - sources:
      # Fetched for COPYING alone - the module itself comes prebuilt and signed in the
      # amneziawg-pkg image above, and that image carries no licence text. §1 is what asks
      # for a copy of the licence, and §3 applies it to object code ("under the terms of
      # Sections 1 and 2 above"), so shipping a binary module obliges us to it. Taken from
      # the module's own source at the same ref rather than vendored here, where it could
      # drift from the ref it claims to cover.
      - url: https://github.com/amnezia-vpn/amneziawg-linux-kernel-module/archive/{{ .BUILD_ARG_AWG_REF }}.tar.gz
        destination: awg-module.tar.gz
        sha256: "{{ .BUILD_ARG_AWG_SHA256 }}"
        sha512: "{{ .BUILD_ARG_AWG_SHA512 }}"
    prepare:
      - |
        mkdir -p module-src && tar -xzf awg-module.tar.gz --strip-components=1 -C module-src
    install:
      - |
        mkdir -p /rootfs/usr/lib/modules && cp -R /usr/lib/modules/* /rootfs/usr/lib/modules/

        mkdir -p /rootfs/usr/local/lib/containers/awg /rootfs/usr/local/etc/containers
        install -m 0755 /pkg/awg-bin /rootfs/usr/local/lib/containers/awg/awg
        cp /pkg/awg-service.yaml /rootfs/usr/local/etc/containers/awg.yaml

        install -D -m 0644 module-src/COPYING \
          /rootfs/usr/local/share/licenses/amneziawg/COPYING
        cat > /rootfs/usr/local/share/licenses/amneziawg/SOURCES <<EOF
        amneziawg-linux-kernel-module {{ .BUILD_ARG_AWG_REF }}, GPL-2.0, COPYING beside this file.
          https://github.com/amnezia-vpn/amneziawg-linux-kernel-module/archive/{{ .BUILD_ARG_AWG_REF }}.tar.gz

        The ext-awg daemon shipped alongside it is MIT OR Apache-2.0 and is a separate work:
          https://github.com/slipmesh/talos-extensions
        EOF
    test:
      - |
        # https://www.kernel.org/doc/html/v4.15/admin-guide/module-signing.html#signed-modules-and-stripping
        find /rootfs/usr/lib/modules -name '*.ko' -exec grep -FL '~Module signature appended~' {} \+
      - |
        # An empty or missing licence is the failure this whole step exists to prevent, and
        # it would otherwise only show up in a published image. Matched on the version line
        # rather than the title, so an upstream relicense to GPLv3 fails here instead of
        # passing while SOURCES and the README still say GPL-2.0.
        grep -q 'Version 2, June 1991' /rootfs/usr/local/share/licenses/amneziawg/COPYING
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
