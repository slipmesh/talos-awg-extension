# Passed straight through as --build-arg=VERSION=... (Makefile computes it as
# $(AWG_SHORT)-$(TALOS_VERSION), same scheme the old Dockerfile.extension-based manifest
# used) rather than reassembled here from other build-args - simpler than the string
# manipulation zfs/vars.yaml does for the same purpose.
VERSION: "{{ .BUILD_ARG_VERSION }}"
