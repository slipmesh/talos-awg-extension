# Triggered by a `vX.Y.Z[+talosA.B.C]` tag - like ../bird, the release tag *is* the published
# image tag (`+` swapped for `-`; see cliff.toml's tag_pattern and the Makefile's
# RELEASE_TAG_SAFE). `make daemons`/`make extension` need ../talos-extensions checked out as a real
# sibling directory (Makefile: `test -d $(DAEMONS_DIR) || exit 1`), so both repos are checked out
# side by side under `$GITHUB_WORKSPACE` and every step below runs with `working-directory:
# talos-awg-extension` to make that relative path resolve correctly.
#
# Unlike router/nftables, this repo doesn't build its own pkgs stage - it *consumes* an already-
# published amneziawg-pkg image from ../talos-kernel, named by versions.env's KERNEL_RELEASE pin
# (that repo's own release tag, bumped by hand - see versions.env). This tag push only succeeds if
# the talos-kernel release KERNEL_RELEASE points at has already been pushed to ghcr.io/slipmesh -
# `make extension`'s bldr invocation will fail loudly (missing base image) if not, same failure
# mode as running it locally before `make kernel` in ../talos-kernel.
#
# EXT_IMAGE already embeds $(TARGET_ARCH) as its own tag suffix (…-amd64 / …-arm64), not a
# combined multi-arch manifest - so this is a plain per-arch matrix, no digest-merge job needed
# (unlike cni-config's release.yml, which does build a single multi-arch manifest).
#
# Each arch runs on its own native runner (ubuntu-24.04-arm for arm64, free for public repos)
# rather than emulating the foreign arch under QEMU on a shared amd64 runner - avoids QEMU
# overhead in the bldr/Docker packaging step entirely (confirmed a real problem on
# ../talos-kernel's own arm64 leg, which blew GitHub Actions' 6h job timeout doing this for a
# full kernel build - this repo's own build is much lighter, but there's no reason to still pay
# the emulation cost once native runners are available). No docker/setup-qemu-action needed any
# more since neither job ever builds a foreign platform.
name: Release extension image

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            rust_target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            rust_target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          path: talos-awg-extension

      - name: Read DAEMONS_REF
        id: pins
        working-directory: talos-awg-extension
        run: |
          ref=$(sed -n 's/^DAEMONS_REF=//p' versions.env)
          [ -n "$ref" ] || { echo 'DAEMONS_REF not found in versions.env'; exit 1; }
          printf 'daemons_ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      # fetch-depth: 0 so `make check-daemons` can resolve the tag with `git describe`; a
      # shallow checkout carries the commit but not the tag that names it.
      - uses: actions/checkout@v4
        with:
          repository: slipmesh/talos-extensions
          ref: ${{ steps.pins.outputs.daemons_ref }}
          fetch-depth: 0
          path: talos-extensions

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: talos-extensions
          key: ${{ matrix.rust_target }}

      - uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push extension image
        working-directory: talos-awg-extension
        run: make extension TARGET_ARCH=${{ matrix.arch }} RELEASE_TAG=${{ github.ref_name }}
